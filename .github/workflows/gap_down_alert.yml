name: Gap Down Alert

on:
  schedule:
    # Two triggers cover both US Central Time offsets; the script itself
    # accepts any post-market-close time and only sends once per day (see
    # already_ran_today), so whichever fires first each day wins. Minutes
    # are offset from :00 because GitHub documents top-of-hour schedules as
    # the most likely to be delayed.
    - cron: "13 23 * * *" # ~6pm CDT (UTC-5), roughly mid-March to early November
    - cron: "13 0 * * *"  # ~6pm CST (UTC-6), roughly early November to mid-March
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gap-down scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Manual runs (workflow_dispatch) always execute regardless of
          # the current time, so you can test on demand.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python gap_down_scanner.py

      - name: Persist last-run state
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_run_date.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_run_date.txt
            git commit -m "Record last sent report date [skip ci]"
            git push
          fi
